function copyText(txt, msg='Copied!'){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>fallbackCopy(txt,msg));
  }else{
    fallbackCopy(txt,msg);
  }
}
function fallbackCopy(txt, msg){
  const ta=document.createElement('textarea');
  ta.value=txt;
  ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0,99999);
  try{document.execCommand('copy');toast(msg);}catch(e){toast('Hold the word to copy');}
  document.body.removeChild(ta);
}

frame(`<h1>Join Room</h1><p class="sub">Type or paste the 5-letter code your partner sent you.</p><div class="stack">
<div class="pill-row">
  <button class="pill ${mySide=='indian'?'on':''}" id="j-in">🇮🇳 I’m Indian</button>
  <button class="pill ${mySide=='filipino'?'on':''}" id="j-ph">🇵🇭 I’m Filipino</button>
</div>
<div class="paper"><b class="t">Room code</b><input id="cd" class="txt" type="text" inputmode="text" maxlength="5" placeholder="ABCDE" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"></div>
<button class="btn pk" id="jn">Join</button>
<button class="btn gh" id="bk">Back</button>
<div class="toast">${msg}</div></div>`);
$('#j-in').onclick=()=>{mySide='indian';localStorage.setItem('wyeit_side','indian');joinScreen(msg)};
$('#j-ph').onclick=()=>{mySide='filipino';localStorage.setItem('wyeit_side','filipino');joinScreen(msg)};
$('#bk').onclick=()=>home();
const go=()=>{
  const c=($('#cd').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  c.length===5?joinRoom(c):joinScreen('The code must be 5 characters.');
};
$('#jn').onclick=go;
$('#cd').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

async function api(method, path, body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||'Request failed');
  return data;
}

async function createRoom(){
  const c=Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.random()*23|0]).join('');
  frame('<h1>Creating room…</h1>');
  try{
    S={lvl:0,ph:'play',paused:false,hint:false,started:false,ver:1};
    const data=await api('POST','/api/room',{action:'create',code:c,side:mySide,state:S});
    code=c;me='host';players=data.players||{};
    startPoll();
    lobby();
  }catch(e){
    home('Could not create room. Make sure api/room.js is deployed on Vercel.');
  }
}

async function joinRoom(c){
  frame('<h1>Joining room…</h1>');
  try{
    const data=await api('POST','/api/room',{action:'join',code:c,side:mySide});
    code=c;me='guest';S=data.state||{lvl:0,ph:'play',paused:false,hint:false,started:false,ver:1};
    players=data.players||{};
    startPoll();
    S.started?draw():lobby();
  }catch(e){
    joinScreen('Room not found. Check the 5-letter code and try again.');
  }
}

function startPoll(){
  stopPoll();
  pollTimer=setInterval(async()=>{
    if(!code)return;
    if(document.activeElement && document.activeElement.tagName==='INPUT')return;
    try{
      const data=await api('GET',`/api/room?code=${code}`);
      players=data.players||{};
      if(inLobby)updateLobbyStatus();
      const remote=data.state;
      if(remote && (remote.ver||0) > (S.ver||0)){
        S=remote;
        if(S.started){inLobby=false;draw();}
      }
    }catch(e){
      try{await api('POST','/api/room',{action:'create',code,side:mySide,state:S});}catch(err){}
    }
  },1600);
}

function stopPoll(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}}

function updateLobbyStatus(){
  const e=$('#pc');
  if(!e)return;
  const both=players.indian&&players.filipino;
  e.textContent=both
    ?(me==='host'?'Both partners are connected! Tap Begin the Escape.':'Connected! Waiting for the host to begin…')
    :'Waiting for your partner to join…';
}

function lobby(){
  inLobby=true;
  frame(`<h1>Game Lobby</h1><p class="sub">${me==='host'?'Tap the code to copy and send to your partner':'You’re in room '+code}</p><div class="stack"><div class="code" id="cp" title="Tap to copy">${code}</div><p class="sub" id="pc"></p>
  <div class="paper"><b class="t">Playing as: ${mySide==='indian'?'🇮🇳 Indian Partner':'🇵🇭 Filipino Partner'}</b><p class="riddle">Work together on your call! On ${mySide==='indian'?'Indian':'Filipino'} rounds you’ll see the secret word to help your partner, and either of you can type the answer.</p></div>
  ${me==='host'?'<button class="btn" id="go">Begin the Escape</button>':''}<button class="btn pk" id="hw">How to Play</button><button class="btn gh" id="ex">Exit</button><div class="toast" id="ts"></div></div>`);
  $('#cp').onclick=()=>copyText(code,'Code copied!');
  $('#ex').onclick=exit;$('#hw').onclick=howto;
  updateLobbyStatus();
  if(me==='host')$('#go').onclick=()=>set({started:true});
}

async function set(p){
  Object.assign(S,p,{ver:(S.ver||0)+1});
  inLobby=false;
  draw();
  try{await api('POST','/api/room',{action:'update',code,state:S});}catch(e){}
}

function draw(){
  if(S.ph==='win')return win();
  const prevInput=$('#gi')?$('#gi').value:'';

  const L=LV[S.lvl];
  const isGuide=(L.guide===mySide);
  const last=S.lvl===LV.length-1;
  const solvedCount=S.lvl+(S.ph==='solved'?1:0);

  let b;
  if(S.ph==='solved'){
    b=`<div class="paper"><span class="tag">Unlocked</span><div class="word" id="sw">${L.w[0]}</div><p class="riddle">${L.f}</p><button class="btn pk" id="nx">${last?'Open the final door':'Next room'}</button></div>`;
  }else{
    const clueText = L.guide==='both'
      ? (mySide==='filipino' ? L.fr : L.ir)
      : L.r;
    const guideBanner = isGuide
      ? `<div class="secret-box"><div class="note">🤫 Your cultural insider word (describe without saying it!):</div><div class="word" id="sw" style="margin:2px 0">${L.w[0]}</div><button type="button" class="copy-chip" id="cpw">Tap to copy word</button></div>`
      : `<p class="note">${L.guide==='both'?'Your partner has the other half of the clue!':'Your partner knows this cultural word and can give you hints!'}</p>`;

    b=`<div class="paper">
      <span class="tag">${L.c}</span>
      <p class="riddle">${clueText}</p>
      ${guideBanner}
      <div class="blanks">${(S.hint?L.w[0][0]:'_')+' _'.repeat(L.w[0].length-1)}</div>
      <input id="gi" class="txt" type="text" inputmode="text" placeholder="Tap here to type" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <button class="btn" id="ck">Unlock</button>
      <button class="btn gh" id="hn">Hint: first letter</button>
    </div>`;
  }

  frame(`<div class="hud"><h2>Door ${S.lvl+1} / ${LV.length}</h2><span class="prog">♥ ${solvedCount} / ${LV.length}</span><span><button class="btn sm gh" id="hp">?</button><button class="btn sm" id="pz">Pause</button><button class="btn sm pk" id="ex">Exit</button></span></div>
  <div class="grid two">${scene(S.ph==='solved')}<div>${b}<div class="toast" id="ts"></div></div></div>
  ${S.paused?`<div class="ov"><div class="in"><h1>Paused</h1><p class="sub">Take a breather. The game is paused for both of you.</p><button class="btn" id="rs">Resume</button><button class="btn gh" id="ex2">Exit game</button></div></div>`:''}
  ${help?`<div class="ov"><div class="in"><h1>How to Play</h1><div class="paper">${HOW}</div><button class="btn" id="hc">Got it</button></div></div>`:''}`);

  $('#pz').onclick=()=>set({paused:true});
  $('#ex').onclick=exit;
  $('#hp').onclick=()=>{help=true;draw()};
  if($('#hc'))$('#hc').onclick=()=>{help=false;draw()};
  if(S.paused){$('#rs').onclick=()=>set({paused:false});$('#ex2').onclick=exit}
  if($('#nx'))$('#nx').onclick=()=>last?set({ph:'win'}):set({lvl:S.lvl+1,ph:'play',hint:false});
  if($('#ck'))$('#ck').onclick=check;
  if($('#hn'))$('#hn').onclick=()=>set({hint:true});
  if($('#sw'))$('#sw').onclick=()=>copyText(L.w[0],'Word copied!');
  if($('#cpw'))$('#cpw').onclick=()=>copyText(L.w[0],'Word copied!');
  if($('#gi')){
    const input=$('#gi');
    input.value=prevInput;
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){input.blur();check();}});
  }
}

function check(){
  const v=norm($('#gi').value);
  if(!v)return;
  if(LV[S.lvl].w.some(x=>norm(x)===v))set({ph:'solved'});
  else toast('Not quite. Try again.');
}

function toast(t){const e=$('#ts');if(e)e.textContent=t}
function win(){
  frame(`<h1>You Escaped!</h1><p class="sub">All 30 doors opened—from adrak chai to tahanan.</p>${scene(true)}<div class="stack"><div class="paper"><b class="t">Mahal kita. Pyaar hai.</b><p class="riddle">Your prize: a big bowl of halo-halo, a cup of adrak chai, and a very long hug. Salamat and dhanyavaad for playing.</p></div><button class="btn" id="ag">Play again</button><button class="btn gh" id="ex">Exit</button></div>`);
  $('#ag').onclick=()=>set({lvl:0,ph:'play',hint:false,paused:false});
  $('#ex').onclick=exit;
}

function exit(){stopPoll();code='';home();}
home();
</script></body></html>
